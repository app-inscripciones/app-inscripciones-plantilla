# D74 · Mantener todo despierto, sin que nadie tenga que hacer nada (bases de Supabase y tareas de GitHub).
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/despertar-base.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Despertar la base

on:
  schedule:
    - cron: '23 9,21 * * *'   # 06:23 y 18:23 (hora argentina)
  workflow_dispatch: {}

permissions:
  contents: write   # para anotar la fecha una vez por mes
  actions: write    # para volver a habilitar las tareas programadas

concurrency:
  group: despertar
  cancel-in-progress: false

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Despertar y mantener activo
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh despertar-base

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
