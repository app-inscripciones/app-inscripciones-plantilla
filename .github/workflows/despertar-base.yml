# D74 · Mantener todo despierto, sin que nadie tenga que hacer nada.
#  · Dos veces por día revisa las dos bases de Supabase: si el plan gratuito las pausó, las despierta solas
#    (lo mismo que el botón «Resume project» de supabase.com), y les hace una consulta mínima para que no se pausen.
#  · GitHub apaga las tareas programadas de un repositorio que pasa 60 días sin cambios: esta tarea las vuelve a
#    habilitar todos los días y, una vez por mes, anota la fecha en .github/actividad.txt para que nunca se apaguen.
#  · También es un botón: Actions → «Despertar la base» → Run workflow (para no esperar).
# Usa SUPABASE_ACCESS_TOKEN y config/instalacion.json (los deja el botón «Instalar»).
name: Despertar la base

on:
  schedule:
    - cron: '23 9,21 * * *'   # 06:23 y 18:23 (hora argentina)
  workflow_dispatch: {}

permissions:
  contents: write   # para anotar la fecha una vez por mes
  actions: write    # para volver a habilitar las tareas programadas

concurrency:
  group: despertar
  cancel-in-progress: false

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Despertar las bases si están pausadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node herramientas/instalador/despertar.mjs

      - name: Que GitHub no apague las tareas automáticas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in respaldo-diario.yml revision-diaria.yml despertar-base.yml; do
            [ -f ".github/workflows/$t" ] && gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$t/enable" >/dev/null 2>&1 || true
          done
          ULTIMO=$(git log -1 --format=%ct)
          AHORA=$(date +%s)
          if [ $(( (AHORA - ULTIMO) / 86400 )) -ge 30 ]; then
            date -u +%Y-%m-%d > .github/actividad.txt
            git config user.name "Sistema"
            git config user.email "sistema@users.noreply.github.com"
            git add .github/actividad.txt
            git commit -m "Actividad mensual (para que GitHub no apague las tareas automáticas)" && git push || true
          fi
