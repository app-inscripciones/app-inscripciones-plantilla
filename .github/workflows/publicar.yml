# Publica la app en Cloudflare Pages cada vez que cambia el código (instituciones instaladas con «Instalar»).
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/publicar.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Publicar la app
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh publicar

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
