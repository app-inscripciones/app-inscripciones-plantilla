# Revisión diaria y avisos automáticos (Etapa 9, punto 4; D58).
#  · Todos los días revisa el respaldo, las bases, las llaves, el correo y el espacio
#    (herramientas/revision/revisar.mjs) y guarda el resultado en la base: el panel lo muestra
#    en «Estado del sistema».
#  · Si algo necesita atención, manda un correo en castellano, desde el Gmail de la institución,
#    a los Responsables generales, diciendo qué hacer.
#  · Si hay un problema y el correo no se puede mandar, esta tarea termina en rojo y GitHub avisa.
#
# Usa los mismos «secrets» que el respaldo diario, y además (si están):
#  · GMAIL_CLAVE_APLICACION: para mandar los avisos (ya está en las instalaciones automáticas).
#  · CLOUDFLARE_API_TOKEN: para avisar antes de que venza la llave de Cloudflare.
#  · GMAIL_CORREO: solo en las instalaciones a mano; en las automáticas sale de config/instalacion.json.
name: Revisión diaria

on:
  schedule:
    - cron: '47 10 * * *'  # todos los días a las 07:47 (hora argentina), después del respaldo de las 03:17
  workflow_dispatch: {}    # también se puede correr a mano: Actions → Revisión diaria → Run workflow

permissions:
  contents: read
  actions: read            # para consultar cómo salió el respaldo diario

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # D74: si el plan gratuito pausó una base, se despierta sola antes de seguir (nadie tiene que entrar a supabase.com).
      # Antes de terminar la instalación (botón «Instalar») no hay nada que revisar ni respaldar: la tarea termina en
      # verde sin hacer nada, para no mandar correos de error a quien está instalando.
      - name: ¿Ya está instalado?
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -f config/instalacion.json ] || [ -n "$SUPABASE_DB_URL" ]; then echo "INSTALADO=1" >> "$GITHUB_ENV"
          else echo "Todavía no se tocó el botón «Instalar»: no hay nada que hacer." | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Despertar las bases si están pausadas
        if: env.INSTALADO == '1'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node herramientas/instalador/despertar.mjs

      - name: Preparar psql (cliente de la base)
        if: env.INSTALADO == '1'
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Armar la conexión a la base
        if: env.INSTALADO == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            URL="$SUPABASE_DB_URL"
          elif [ -f config/instalacion.json ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$CLAVE_RESPALDO" ]; then
            URL=$(node herramientas/instalador/url-base.mjs real || true)
          fi
          # Si no hay conexión, la revisión igual corre: avisa que no pudo conectarse.
          [ -n "$URL" ] && echo "::add-mask::$URL"
          echo "URL_BASE=${URL:-postgresql://sin-conexion}" >> "$GITHUB_ENV"

      - name: Revisar y avisar
        if: env.INSTALADO == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_CLAVE_APLICACION: ${{ secrets.GMAIL_CLAVE_APLICACION }}
          GMAIL_CORREO: ${{ secrets.GMAIL_CORREO }}
        run: node herramientas/revision/revisar.mjs
