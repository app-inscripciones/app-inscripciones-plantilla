# Instalación automática para una institución nueva (D34, Etapa 8).
# Antes, a mano (ver el manual de instalación): crear el Gmail, las cuentas de GitHub, Supabase y Cloudflare,
# la copia de este repositorio y cargar 4 secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, CLAVE_RESPALDO y GMAIL_CLAVE_APLICACION.
# Después: Actions → Instalar → Run workflow → completar los 4 datos → Run workflow. Se puede volver a correr.
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/instalar.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Instalar

on:
  workflow_dispatch:
    inputs:
      nombre_institucion:
        description: 'Nombre de la institución, como se va a ver en la app (hoja de accesos: arriba, «Institución»)'
        required: true
      correo_proyecto:
        description: 'Gmail de la institución, el del paso 1 (hoja de accesos: casilla B1)'
        required: true
      correo_responsable:
        description: 'Correo con el que va a entrar al panel el Responsable general (hoja de accesos: casilla A2)'
        required: true
      nombre_responsable:
        description: 'Nombre y apellido del Responsable general (hoja de accesos: casilla A1)'
        required: true

permissions:
  contents: write

concurrency:
  group: instalar
  cancel-in-progress: false

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar todo
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh instalar

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
