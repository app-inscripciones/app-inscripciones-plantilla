# Recuperar un respaldo EN LA BASE DE PRUEBAS (D59). Nunca toca la base real.
#  · Se elige la fecha del respaldo (vacío = el más reciente). Se guardan 90 días.
#  · La base de pruebas queda con los datos de ese día: ahí se puede mirar lo que se perdió
#    (Supabase → proyecto de pruebas → Table Editor) sin riesgo.
#  · Para pasar esos datos a la base real está el otro botón: «Pasar un respaldo a la base real».
#
# Usa CLAVE_RESPALDO y la conexión a la base de pruebas: en las instalaciones automáticas se arma sola
# (SUPABASE_ACCESS_TOKEN); en una instalación a mano, el secret SUPABASE_DB_URL_PRUEBAS («Session pooler» de pruebas).
name: Recuperar respaldo (en la base de pruebas)

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha del respaldo, así: 2026-10-13 (vacío = el más reciente)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read            # para bajar los respaldos guardados

concurrency:
  group: base-pruebas
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Armar la conexión a la base de pruebas
        env:
          SUPABASE_DB_URL_PRUEBAS: ${{ secrets.SUPABASE_DB_URL_PRUEBAS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
        run: |
          if [ -n "$SUPABASE_DB_URL_PRUEBAS" ]; then URL="$SUPABASE_DB_URL_PRUEBAS"
          elif [ -f config/instalacion.json ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then URL=$(node herramientas/instalador/url-base.mjs pruebas)
          else echo "::error::Falta la conexión a la base de pruebas (SUPABASE_DB_URL_PRUEBAS o SUPABASE_ACCESS_TOKEN)."; exit 1; fi
          echo "::add-mask::$URL"
          echo "URL_DESTINO=$URL" >> "$GITHUB_ENV"

      - name: Recuperar
        env:
          DESTINO: pruebas
          FECHA: ${{ inputs.fecha }}
          CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/recuperar/recuperar.sh
