# Recuperar un respaldo EN LA BASE DE PRUEBAS (D59). Nunca toca la base real.
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/recuperar-respaldo.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Recuperar respaldo (en la base de pruebas)

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha del respaldo, así: 2026-10-13 (vacío = el más reciente)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read            # para bajar los respaldos guardados

concurrency:
  group: base-pruebas
  cancel-in-progress: false

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Recuperar en la base de pruebas
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh recuperar-respaldo

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
