# Pasar un respaldo A LA BASE REAL (D59). Reemplaza TODOS los datos de la base real por los de ese día.
#  · Usarlo solo después de mirar el respaldo en la base de pruebas («Recuperar respaldo (en la base de pruebas)»).
#  · Pide escribir la confirmación exacta: REEMPLAZAR LA BASE REAL
#  · Antes de reemplazar, guarda una copia cifrada de cómo estaba la base real («antes-de-recuperar-…», 90 días):
#    para deshacer, se vuelve a correr este botón escribiendo ese nombre en lugar de la fecha.
#  · Todo se hace en una sola operación: si algo falla, la base real queda exactamente como estaba.
name: Pasar un respaldo a la base real

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha del respaldo, así: 2026-10-13 (vacío = el más reciente). Para deshacer: el nombre «antes-de-recuperar-…»'
        required: false
        default: ''
      confirmacion:
        description: 'Escribí exactamente: REEMPLAZAR LA BASE REAL'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: base-real
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Controlar la confirmación
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "REEMPLAZAR LA BASE REAL" ]; then
            echo "::error::No se hizo nada. Para reemplazar la base real hay que escribir exactamente: REEMPLAZAR LA BASE REAL"
            echo "❌ No se hizo nada: la confirmación no coincide." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Armar la conexión a la base real
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then URL="$SUPABASE_DB_URL"
          elif [ -f config/instalacion.json ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then URL=$(node herramientas/instalador/url-base.mjs real)
          else echo "::error::Falta la conexión a la base real (SUPABASE_DB_URL o SUPABASE_ACCESS_TOKEN)."; exit 1; fi
          echo "::add-mask::$URL"
          echo "URL_DESTINO=$URL" >> "$GITHUB_ENV"

      - name: Copiar la base real y reemplazarla
        env:
          DESTINO: real
          FECHA: ${{ inputs.fecha }}
          CLAVE_RESPALDO: ${{ secrets.CLAVE_RESPALDO }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/recuperar/recuperar.sh

      - name: Guardar la copia de cómo estaba la base real (90 días)
        if: always() && env.COPIA_PREVIA != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COPIA_PREVIA }}
          path: salida/${{ env.COPIA_PREVIA }}.dump.gpg
          retention-days: 90
          if-no-files-found: ignore
