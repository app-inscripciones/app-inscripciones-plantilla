# Pasar un respaldo A LA BASE REAL (D59). Reemplaza TODOS los datos de la base real por los de ese día.
# Antes guarda una copia de cómo estaba («antes-de-recuperar-…») para poder deshacer.
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/pasar-respaldo-a-la-real.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Pasar un respaldo a la base real

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha del respaldo, así: 2026-10-13 (vacío = el más reciente). Para deshacer: el nombre «antes-de-recuperar-…»'
        required: false
        default: ''
      confirmacion:
        description: 'Escribí exactamente: REEMPLAZAR LA BASE REAL'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: base-real
  cancel-in-progress: false

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasar el respaldo a la base real
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh pasar-respaldo-a-la-real

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
