# Respaldo diario cifrado de la base central, con prueba de recuperación (D18). Se guarda 90 días en «Artifacts».
# ⚠️ Esta es una «cáscara» (D76): solo dice CUÁNDO corre la tarea. Lo que HACE está en herramientas/tareas/respaldo-diario.sh,
# que se actualiza con el botón «Actualizar». Este archivo casi nunca cambia: no hace falta tocarlo.
name: Respaldo diario

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días a las 03:17 (hora argentina)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tarea:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Hacer el respaldo
        env:
          SECRETOS: ${{ toJSON(secrets) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: bash herramientas/tareas/correr.sh respaldo-diario

      - name: Guardar la copia (90 días)
        if: always() && env.ARTEFACTO != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTEFACTO }}
          path: salida/subir/
          retention-days: 90
          if-no-files-found: ignore
